<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THEO — Reset Cache</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F4F2EE;
      color: #0B1730;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      padding: 28px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1px solid rgba(192, 137, 47, 0.45);
    }
    h1 { font-size: 18px; margin: 0 0 8px; color: #B77D22; }
    p { font-size: 13px; color: #52637A; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resetting THEO Cache…</h1>
    <p id="msg">Unregistering THEO Remote service worker and clearing THEO Remote caches only.</p>
  </div>
  <script>
    (async () => {
      const scopePrefix = new URL('./', location.href).href;
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) {
            if (r && r.scope && r.scope.startsWith(scopePrefix)) {
              await r.unregister();
            }
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) {
            if (k.startsWith('theo-remote-') || k.startsWith('theo-nav-handoff-')) {
              await caches.delete(k);
            }
          }
        }
      } catch (e) {}
      document.getElementById('msg').textContent = 'THEO cache cleared. Redirecting…';
      setTimeout(() => location.replace('./?reset=' + Date.now()), 450);
    })();
  </script>
</body>
</html>
