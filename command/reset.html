<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THEO Planner — Reset &amp; Redirect</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F8F6F1;
      color: #0F172A;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      padding: 28px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1px solid rgba(181, 123, 30, 0.35);
    }
    h1 { font-size: 18px; margin: 0 0 8px; color: #B57B1E; }
    p { font-size: 13px; color: #64748B; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resetting Legacy Command Cache…</h1>
    <p id="msg">Clearing legacy /command/ cache and redirecting to Planner…</p>
  </div>
  <script>
    (async () => {
      const scopePrefix = new URL('./', location.href).href;
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) {
            if (r && r.scope && r.scope.startsWith(scopePrefix)) {
              await r.unregister();
            }
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) {
            if (k.startsWith('theo-command-') || k.startsWith('theo-planner-')) {
              await caches.delete(k);
            }
          }
        }
      } catch (e) {}
      const targetPlanner = new URL('../../planner/', location.href);
      targetPlanner.searchParams.set('reset', String(Date.now()));
      document.getElementById('msg').textContent = 'Redirecting to THEO Planner…';
      setTimeout(() => location.replace(targetPlanner.href), 450);
    })();
  </script>
</body>
</html>
